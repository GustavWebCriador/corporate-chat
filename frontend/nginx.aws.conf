#Essa configuração permite acessar diretamente rotas do React, como /login, /dashboard e /admin, sem receber erro 404 ao atualizar a página.
server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|mjs|svg|ico|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
